<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} – GCCopro</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="manifest" href="{{ url_for('pwa.manifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <meta name="theme-color" content="#2f5d8a">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('calendar.index') }}">GCCopro</a>
    {% if current_user %}
    <nav>
      <a href="{{ url_for('calendar.index') }}">Calendrier</a>
      <a href="{{ url_for('account.my_weeks') }}">Mes semaines</a>
      <a href="{{ url_for('info.index') }}">Infos</a>
      {% if current_user.role == 'admin' %}<a href="{{ url_for('admin.index') }}">Admin</a>{% endif %}
      <form method="post" action="{{ url_for('account.logout') }}" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="link">Déconnexion</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="flash {{ category }}" role="status">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
